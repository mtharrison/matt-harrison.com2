<?xml version="1.0" standalone="yes"?><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="'Kalam','Caveat','Patrick Hand','Comic Sans MS',cursive" style="zoom: 1;"><defs><style>@import url('https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&amp;display=swap');</style><filter id="r3" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="11"></feTurbulence><feDisplacementMap in="SourceGraphic" scale="1.6"></feDisplacementMap></filter></defs><rect width="720" height="360" fill="#fdfaf2"></rect><text x="360" y="38" font-size="22" font-weight="700" fill="#222" text-anchor="middle">state is a row of channels, each with its own merge rule</text><g filter="url(#r3)"><rect x="40" y="90" width="190" height="220" rx="12" fill="#fff5d6" stroke="#222" stroke-width="2"></rect><rect x="265" y="90" width="190" height="220" rx="12" fill="#d6ecff" stroke="#222" stroke-width="2"></rect><rect x="490" y="90" width="190" height="220" rx="12" fill="#e6f7e0" stroke="#222" stroke-width="2"></rect></g><text x="135" y="125" font-size="20" font-weight="700" text-anchor="middle">messages</text><text x="360" y="125" font-size="20" font-weight="700" text-anchor="middle">userId</text><text x="585" y="125" font-size="20" font-weight="700" text-anchor="middle">retrievedDocs</text><line x1="55" y1="140" x2="215" y2="140" stroke="#aaa" stroke-dasharray="4 4"></line><line x1="280" y1="140" x2="440" y2="140" stroke="#aaa" stroke-dasharray="4 4"></line><line x1="505" y1="140" x2="665" y2="140" stroke="#aaa" stroke-dasharray="4 4"></line><text x="135" y="170" font-size="16" text-anchor="middle">reducer:</text><text x="135" y="195" font-size="18" font-weight="700" text-anchor="middle">append</text><text x="135" y="240" font-size="14" text-anchor="middle">(via messages</text><text x="135" y="258" font-size="14" text-anchor="middle">StateReducer)</text><text y="280.190735px" font-size="14" text-anchor="middle" x="136.961853px">new msgs add on,</text><text y="299.171661px" font-size="14" text-anchor="middle" x="136.961853px">edits update by id</text><text x="360" y="170" font-size="16" text-anchor="middle">no reducer:</text><text x="360" y="195" font-size="18" font-weight="700" text-anchor="middle">overwrite</text><text x="360" y="240" font-size="14" text-anchor="middle">last write wins</text><text x="360" y="270" font-size="14" text-anchor="middle">(fine for scalars,</text><text x="360" y="288" font-size="14" text-anchor="middle">a footgun for lists)</text><text x="585" y="170" font-size="16" text-anchor="middle">reducer:</text><text x="585" y="195" font-size="18" font-weight="700" text-anchor="middle">concat</text><text x="585" y="240" font-size="14" text-anchor="middle">(a, b) =&gt; a.concat(b)</text><text x="585" y="280" font-size="14" text-anchor="middle">parallel branches can</text><text x="585" y="298" font-size="14" text-anchor="middle">both add without losing</text></svg>
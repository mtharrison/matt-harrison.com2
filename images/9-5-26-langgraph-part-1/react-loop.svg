<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="'Kalam','Caveat','Patrick Hand','Comic Sans MS',cursive">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&amp;display=swap');</style>
    <filter id="r2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.8"/>
    </filter>
    <marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
  </defs>
  <rect width="720" height="360" fill="#fdfaf2"/>
  <text x="360" y="38" font-size="22" font-weight="700" fill="#222" text-anchor="middle">a ReAct agent is just a tiny graph</text>

  <g filter="url(#r2)">
    <ellipse cx="100" cy="180" rx="55" ry="35" fill="#fff5d6" stroke="#222" stroke-width="2"/>
    <rect x="240" y="140" width="140" height="80" rx="10" fill="#d6ecff" stroke="#222" stroke-width="2"/>
    <path d="M460 180 L520 130 L580 180 L520 230 z" fill="#fff0e0" stroke="#222" stroke-width="2"/>
    <rect x="630" y="140" width="60" height="80" rx="10" fill="#e6f7e0" stroke="#222" stroke-width="2"/>
    <rect x="240" y="280" width="140" height="60" rx="10" fill="#ffe6f0" stroke="#222" stroke-width="2"/>
  </g>

  <text x="100" y="186" font-size="18" font-weight="700" text-anchor="middle">START</text>
  <text x="310" y="178" font-size="20" font-weight="700" text-anchor="middle">agent (LLM)</text>
  <text x="310" y="200" font-size="13" text-anchor="middle">picks tool or stops</text>
  <text x="520" y="180" font-size="16" font-weight="700" text-anchor="middle">tool calls?</text>
  <text x="660" y="186" font-size="18" font-weight="700" text-anchor="middle">END</text>
  <text x="310" y="316" font-size="20" font-weight="700" text-anchor="middle">tools</text>
  <text x="310" y="334" font-size="13" text-anchor="middle">runs &amp; returns results</text>

  <g stroke="#222" stroke-width="2" fill="none" filter="url(#r2)">
    <path d="M155 180 L240 180" marker-end="url(#ah2)"/>
    <path d="M380 180 L460 180" marker-end="url(#ah2)"/>
    <path d="M580 180 L630 180" marker-end="url(#ah2)"/>
    <path d="M520 230 L520 290 L380 310" marker-end="url(#ah2)"/>
    <path d="M240 310 L150 310 L150 220 L240 200" marker-end="url(#ah2)"/>
  </g>
  <text x="600" y="170" font-size="14" fill="#444">no</text>
  <text x="540" y="270" font-size="14" fill="#444">yes</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="'Kalam','Caveat','Patrick Hand','Comic Sans MS',cursive">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&amp;display=swap');</style>
    <filter id="rD" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="19"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="ahD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
  </defs>
  <rect width="720" height="380" fill="#fdfaf2"/>
  <text x="360" y="38" font-size="22" font-weight="700" fill="#222" text-anchor="middle">supervisor + workers, each worker a subgraph</text>

  <g filter="url(#rD)">
    <rect x="290" y="80" width="160" height="80" rx="10" fill="#fff5d6" stroke="#222" stroke-width="2"/>
    <rect x="40" y="240" width="170" height="100" rx="10" fill="#d6ecff" stroke="#222" stroke-width="2" stroke-dasharray="6 4"/>
    <rect x="280" y="240" width="170" height="100" rx="10" fill="#e6f7e0" stroke="#222" stroke-width="2" stroke-dasharray="6 4"/>
    <rect x="520" y="240" width="170" height="100" rx="10" fill="#ffe6f0" stroke="#222" stroke-width="2" stroke-dasharray="6 4"/>
  </g>

  <text x="370" y="115" font-size="20" font-weight="700" text-anchor="middle">supervisor</text>
  <text x="370" y="138" font-size="13" text-anchor="middle">picks next worker,</text>
  <text x="370" y="154" font-size="13" text-anchor="middle">returns Command(goto)</text>

  <text x="125" y="275" font-size="18" font-weight="700" text-anchor="middle">researcher</text>
  <text x="125" y="298" font-size="12" text-anchor="middle">subgraph: ReAct loop</text>
  <text x="125" y="316" font-size="12" text-anchor="middle">+ search tools</text>

  <text x="365" y="275" font-size="18" font-weight="700" text-anchor="middle">writer</text>
  <text x="365" y="298" font-size="12" text-anchor="middle">subgraph: drafts prose,</text>
  <text x="365" y="316" font-size="12" text-anchor="middle">no tools</text>

  <text x="605" y="275" font-size="18" font-weight="700" text-anchor="middle">critic</text>
  <text x="605" y="298" font-size="12" text-anchor="middle">subgraph: scores draft,</text>
  <text x="605" y="316" font-size="12" text-anchor="middle">flags rewrites</text>

  <g stroke="#222" stroke-width="2" fill="none" filter="url(#rD)">
    <path d="M310 160 L150 240" marker-end="url(#ahD)"/>
    <path d="M370 160 L370 240" marker-end="url(#ahD)"/>
    <path d="M430 160 L590 240" marker-end="url(#ahD)"/>
    <path d="M125 240 C 200 200, 280 180, 290 130" marker-end="url(#ahD)" stroke-dasharray="4 4"/>
    <path d="M365 240 L365 165" marker-end="url(#ahD)" stroke-dasharray="4 4"/>
    <path d="M605 240 C 530 200, 460 180, 450 130" marker-end="url(#ahD)" stroke-dasharray="4 4"/>
  </g>

  <text x="360" y="365" font-size="13" fill="#666" text-anchor="middle">workers all share the messages channel, supervisor reads it to decide what's next</text>
</svg>

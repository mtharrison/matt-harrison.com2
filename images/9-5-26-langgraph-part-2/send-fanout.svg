<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="'Kalam','Caveat','Patrick Hand','Comic Sans MS',cursive">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&amp;display=swap');</style>
    <filter id="rE" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="25"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="ahE" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
  </defs>
  <rect width="720" height="400" fill="#fdfaf2"/>
  <text x="360" y="38" font-size="22" font-weight="700" fill="#222" text-anchor="middle">Send: fan out to N workers, where N is decided at runtime</text>

  <g filter="url(#rE)">
    <rect x="280" y="70" width="160" height="70" rx="10" fill="#fff5d6" stroke="#222" stroke-width="2"/>
    <rect x="40" y="210" width="140" height="60" rx="10" fill="#d6ecff" stroke="#222" stroke-width="2"/>
    <rect x="200" y="210" width="140" height="60" rx="10" fill="#d6ecff" stroke="#222" stroke-width="2"/>
    <rect x="360" y="210" width="140" height="60" rx="10" fill="#d6ecff" stroke="#222" stroke-width="2"/>
    <rect x="520" y="210" width="140" height="60" rx="10" fill="#d6ecff" stroke="#222" stroke-width="2"/>
    <rect x="280" y="320" width="160" height="60" rx="10" fill="#e6f7e0" stroke="#222" stroke-width="2"/>
  </g>

  <text x="360" y="100" font-size="18" font-weight="700" text-anchor="middle">planner</text>
  <text x="360" y="122" font-size="13" text-anchor="middle">LLM picks subtopics</text>

  <text x="110" y="240" font-size="15" font-weight="700" text-anchor="middle">researcher</text>
  <text x="110" y="258" font-size="11" text-anchor="middle">{ subtopic: "a" }</text>
  <text x="270" y="240" font-size="15" font-weight="700" text-anchor="middle">researcher</text>
  <text x="270" y="258" font-size="11" text-anchor="middle">{ subtopic: "b" }</text>
  <text x="430" y="240" font-size="15" font-weight="700" text-anchor="middle">researcher</text>
  <text x="430" y="258" font-size="11" text-anchor="middle">{ subtopic: "c" }</text>
  <text x="590" y="240" font-size="15" font-weight="700" text-anchor="middle">researcher</text>
  <text x="590" y="258" font-size="11" text-anchor="middle">{ subtopic: "d" }</text>

  <text x="360" y="350" font-size="18" font-weight="700" text-anchor="middle">synthesiser</text>
  <text x="360" y="370" font-size="12" text-anchor="middle">implicit barrier waits for all</text>

  <g stroke="#222" stroke-width="2" fill="none" filter="url(#rE)">
    <path d="M320 140 L110 210" marker-end="url(#ahE)"/>
    <path d="M340 140 L270 210" marker-end="url(#ahE)"/>
    <path d="M380 140 L430 210" marker-end="url(#ahE)"/>
    <path d="M400 140 L590 210" marker-end="url(#ahE)"/>
    <path d="M110 270 L320 320" marker-end="url(#ahE)"/>
    <path d="M270 270 L340 320" marker-end="url(#ahE)"/>
    <path d="M430 270 L380 320" marker-end="url(#ahE)"/>
    <path d="M590 270 L400 320" marker-end="url(#ahE)"/>
  </g>

  <text x="360" y="180" font-size="12" fill="#666" text-anchor="middle">Send("researcher", { subtopic }) one per item</text>
</svg>

<?xml version="1.0" standalone="yes"?><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="'Kalam','Caveat','Patrick Hand','Comic Sans MS',cursive" style="zoom: 1;"><defs><style>@import url('https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&amp;display=swap');</style><filter id="r7" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="29"></feTurbulence><feDisplacementMap in="SourceGraphic" scale="1.7"></feDisplacementMap></filter><marker id="ah7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"></path></marker></defs><rect width="720" height="380" fill="#fdfaf2"></rect><text x="360" y="38" font-size="22" font-weight="700" fill="#222" text-anchor="middle">interrupt() is a suspend point, not a return</text><g filter="url(#r7)"><rect x="40" y="80" width="160" height="80" rx="10" fill="#fff5d6" stroke="#222" stroke-width="2"></rect><rect x="240" y="80" width="160" height="80" rx="10" fill="#d6ecff" stroke="#222" stroke-width="2"></rect><rect x="440" y="80" width="240" height="80" rx="10" fill="#ffe6e6" stroke="#222" stroke-width="2"></rect><rect x="40" y="240" width="160" height="80" rx="10" fill="#e6f7e0" stroke="#222" stroke-width="2"></rect><rect x="240" y="240" width="160" height="80" rx="10" fill="#d6ecff" stroke="#222" stroke-width="2"></rect><rect x="440" y="240" width="240" height="80" rx="10" fill="#fff0e0" stroke="#222" stroke-width="2"></rect></g><text x="120" y="115" font-size="16" font-weight="700" text-anchor="middle">first invoke</text><text x="120" y="138" font-size="13" text-anchor="middle">graph runs draft node,</text><text x="120" y="154" font-size="13" text-anchor="middle">enters approval node</text><text x="320" y="115" font-size="16" font-weight="700" text-anchor="middle">interrupt()</text><text x="320" y="138" font-size="13" text-anchor="middle">checkpoint saved,</text><text x="320" y="154" font-size="13" text-anchor="middle">execution stops</text><text x="560" y="115" font-size="16" font-weight="700" text-anchor="middle">days pass</text><text x="560" y="138" font-size="13" text-anchor="middle">graph isn't running.</text><text x="560" y="154" font-size="13" text-anchor="middle">user gets a Slack ping.</text><text x="120" y="275" font-size="16" font-weight="700" text-anchor="middle">human approves</text><text x="120" y="298" font-size="13" text-anchor="middle">backend sends</text><text x="120" y="314" font-size="13" text-anchor="middle">Command(resume: ...)</text><text x="320" y="275" font-size="16" font-weight="700" text-anchor="middle">resume invoke</text><text x="320" y="298" font-size="13" text-anchor="middle">checkpoint loads,</text><text x="320" y="314" font-size="13" text-anchor="middle">interrupt() returns</text><text x="560" y="275" font-size="16" font-weight="700" text-anchor="middle">node finishes</text><text x="560" y="298" font-size="13" text-anchor="middle">downstream nodes run,</text><text x="560" y="314" font-size="13" text-anchor="middle">graph reaches END</text><g stroke="#222" stroke-width="2" fill="none" filter="url(#r7)"><path d="M200 120 L240 120" marker-end="url(#ah7)"></path><path d="M400 120 L440 120" marker-end="url(#ah7)"></path><path d="M560 160 L320 240" marker-end="url(#ah7)" stroke-dasharray="6 6"></path><path d="M200 280 L240 280" marker-end="url(#ah7)"></path><path d="M400 280 L440 280" marker-end="url(#ah7)"></path></g><text y="198.228882px" font-size="13" text-anchor="middle" x="318.460449px" fill="#666">(could be a different process)</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="'Kalam','Caveat','Patrick Hand','Comic Sans MS',cursive">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&amp;display=swap');</style>
    <filter id="r4" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="14"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="ah4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
  </defs>
  <rect width="720" height="360" fill="#fdfaf2"/>
  <text x="360" y="38" font-size="22" font-weight="700" fill="#222" text-anchor="middle">a node returns a delta, the reducer figures out the rest</text>

  <g filter="url(#r4)">
    <rect x="40" y="100" width="200" height="180" rx="12" fill="#fff5d6" stroke="#222" stroke-width="2"/>
    <rect x="270" y="160" width="180" height="60" rx="10" fill="#d6ecff" stroke="#222" stroke-width="2"/>
    <rect x="480" y="100" width="200" height="180" rx="12" fill="#e6f7e0" stroke="#222" stroke-width="2"/>
  </g>

  <text x="140" y="130" font-size="18" font-weight="700" text-anchor="middle">current state</text>
  <text x="140" y="170" font-size="14" text-anchor="middle">messages: [user("hi")]</text>
  <text x="140" y="200" font-size="14" text-anchor="middle">userId: "abc"</text>
  <text x="140" y="230" font-size="14" text-anchor="middle">docs: [d1]</text>

  <text x="360" y="190" font-size="18" font-weight="700" text-anchor="middle">node returns</text>
  <text x="360" y="212" font-size="13" text-anchor="middle">{ messages: [ai("hey")] }</text>

  <text x="580" y="130" font-size="18" font-weight="700" text-anchor="middle">merged state</text>
  <text x="580" y="170" font-size="14" text-anchor="middle">messages: [user, ai]</text>
  <text x="580" y="200" font-size="14" text-anchor="middle">userId: "abc"</text>
  <text x="580" y="230" font-size="14" text-anchor="middle">docs: [d1]</text>

  <g stroke="#222" stroke-width="2" fill="none" filter="url(#r4)">
    <path d="M240 190 L270 190" marker-end="url(#ah4)"/>
    <path d="M450 190 L480 190" marker-end="url(#ah4)"/>
  </g>

  <text x="360" y="265" font-size="14" fill="#666" text-anchor="middle">only messages changes,</text>
  <text x="360" y="282" font-size="14" fill="#666" text-anchor="middle">untouched fields stay put</text>
</svg>
